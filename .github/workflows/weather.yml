name: Collect Weather Data

on:
  schedule:
    # 매일 한국 시간 기준 아침 9시(UTC 기준 0시)에 실행 예시
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼 유지
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather script
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
        run: python main.py

      - name: Commit and push weather data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update weather data" && git push)
